name: Bug report
description: Report a problem with Recall
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Ideally against a minimal repository. Include the exact `recall` command you ran.
      placeholder: |
        1. `recall init` in a repo with...
        2. `recall status`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: '`recall doctor --verbose` output'
      description: If Recall is initialized, please paste the output.
      render: shell

  - type: input
    id: cli-version
    attributes:
      label: Recall CLI version
      placeholder: recall --version
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: node --version
    validations:
      required: true

  - type: dropdown
    id: package-manager
    attributes:
      label: Package manager
      options:
        - pnpm
        - npm
        - yarn
        - other/unknown
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: true
