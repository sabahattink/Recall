name: Bug report
description: Report a problem with Recall
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Exact command
      description: The exact `recall` command that triggered this (including flags).
      placeholder: npx recall-context init . --force
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Ideally against a minimal, sanitized repository (no proprietary code or secrets) — a small public repo, or a fixture you can share.
      placeholder: |
        1. Create a repo with...
        2. Run `npx recall-context init`
        3. See .recall/memory.json / the error
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual output
      description: Paste the exact terminal output, including any error message.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: repo-type
    attributes:
      label: Repository type
      options:
        - Git repository
        - Non-Git repository
        - Git monorepo (multiple workspaces)
        - Unsure
    validations:
      required: true

  - type: textarea
    id: debug
    attributes:
      label: Output with RECALL_DEBUG=1
      description: For an "Unexpected failure" (exit code 1), re-run with RECALL_DEBUG=1 and paste the stack trace.
      render: shell

  - type: input
    id: cli-version
    attributes:
      label: Recall CLI version
      placeholder: recall --version
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: node --version
    validations:
      required: true

  - type: dropdown
    id: package-manager
    attributes:
      label: Package manager
      options:
        - pnpm
        - npm
        - yarn
        - other/unknown
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: true
