name: Feature request
description: Suggest an idea or enhancement for Recall
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that Recall doesn't support today?
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: How are you handling this today, if at all (manual steps, a different tool, editing generated files directly)?

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: How would you like this to work? Include example command output if relevant.
    validations:
      required: true

  - type: input
    id: target-agent
    attributes:
      label: Target agent/tool (if relevant)
      description: The AI coding agent or tool this would help — e.g. Claude Code, Codex, Gemini CLI, Cursor.

  - type: dropdown
    id: area
    attributes:
      label: What does this affect?
      options:
        - CLI (commands, flags, exit codes)
        - Context output (.recall/ content, recall context)
        - Integration with an external agent/tool
        - Something else
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: principles
    attributes:
      label: Fit with Recall's principles
      description: Recall is local-first, deterministic-by-default, and provider-independent (see README). Please confirm your proposal is compatible.
      options:
        - label: This does not require a mandatory account, cloud database, or AI provider to work
        - label: This does not require Recall to execute or evaluate the analyzed repository's source code
