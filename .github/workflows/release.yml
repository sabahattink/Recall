name: Release

on:
  push:
    # See the matching comment in ci.yml: this repository has no `main`
    # branch yet, so its actual current default branch is listed here too.
    # Drop the second entry once the repository is renamed for release.
    branches: [main, claude/recall-cli-build-nymjvl]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version or publish packages
    runs-on: ubuntu-latest
    # Only run when a repository secret for publishing is configured. This
    # keeps a fork or a repo without publish credentials from failing this
    # job on every push to main, and prevents any accidental publish without
    # an explicit, maintainer-configured secret.
    if: ${{ vars.RECALL_RELEASES_ENABLED == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Create release pull request or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
